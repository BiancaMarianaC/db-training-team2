# ============================================================================
# docker-compose.yml — TradeFlow full-stack runtime (TICKET-I127 + I128)
# ============================================================================
# WHAT:    8 services: postgres, zookeeper, kafka, kafdrop, backend, frontend,
#          prometheus, grafana — one `docker compose up -d` brings up the
#          whole platform.
# HOW:     A single default compose network gives every service DNS
#          resolution by name (e.g. "postgres", "kafka", "backend") — no
#          extra `networks:` block needed for that (TICKET-I128).
# WHY:     A single command must bring up the whole platform reproducibly
#          for the Day 10 final demo and for the CI/CD pipeline.
# OBSERVE: After `docker compose up -d` all services reach 'Up (healthy)'
#          within ~60s of a cold start; the recon flow works end-to-end.
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — primary store for trades, counterparties, recon results
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tradeflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Zookeeper — Kafka's coordination service (cp-kafka 7.5.0 still needs it)
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tradeflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka — event backbone for TradeEvent (Day 9)
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tradeflow-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: "kafka:29092" is what other containers use
      # (backend, kafdrop); "localhost:9092" is for tools running on the
      # host (kafka-console-producer from a laptop terminal, IDE, etc.).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafdrop — Kafka UI, used to eyeball trade-events during the demo/smoke
  # --------------------------------------------------------------------------
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: tradeflow-kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx128M"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Backend — Spring Boot recon-service
  # --------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/biancamarianac/tradeflow-backend:latest}
    container_name: tradeflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Frontend — React UI behind nginx
  # --------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/biancamarianac/tradeflow-frontend:latest}
    container_name: tradeflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      # 127.0.0.1, not localhost: "localhost" resolves ::1 first in this
      # image and nginx's `listen 80;` only binds IPv4, so the IPv6 attempt
      # gets refused before wget falls back — same bug verified in I126.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Prometheus — scrapes /actuator/prometheus from backend
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: tradeflow-prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Grafana — dashboards for API + Kafka metrics (auto-provisioned)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: tradeflow-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  grafana-data:
