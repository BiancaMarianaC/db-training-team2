# ============================================================================
# frontend/nginx.conf — TICKET-I126 + TICKET-I128
# ============================================================================
# WHAT:    Nginx server block for the production React UI.
# HOW:     SPA fallback + reverse proxy for the API.
# WHY:     One origin (no CORS), one image, easy to deploy.
# OBSERVE: GET /trades returns index.html (so React Router takes over).
#          GET /api/v1/trades is proxied to the backend container.
# ============================================================================

server {
    listen 80;
    server_name _;

    # ---- SPA fallback ------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Reverse-proxy API to the backend container ------------------------
    # Inside docker-compose the backend is reachable as `backend:8080`
    # (TICKET-I128 wires the compose network). Using a variable + Docker's
    # embedded DNS resolver (127.0.0.11) forces nginx to resolve "backend"
    # lazily, per-request, instead of once at config-load time — a plain
    # `proxy_pass http://backend:8080;` makes nginx refuse to start at all
    # ("host not found in upstream") whenever the container runs standalone,
    # e.g. the Sprint 1 smoke-boot before compose wires the network.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
